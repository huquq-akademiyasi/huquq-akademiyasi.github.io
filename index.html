<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huquq Akademiyasi</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Davlat va huquq nazariyasi: mavzulashtirilgan ma'ruzalar, taqdimotlar, atamalar lug'ati, testlar va xatolar daftari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: o'quv qo'llanma — chapda doimiy navigatsiya (telefonda pastki panel), o'ngda ~68ch matn ustuni */
:root{
  --paper:#f5f7f6; --sheet:#ffffff; --ink:#152238; --muted:#5b6878; --rule:#d9e1de;
  --seal:#0b6e5a; --seal-soft:#e2f1ec; --sky:#1d6fa8; --ok:#1f7a3e; --ok-soft:#e3f3e8;
  --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1519; --sheet:#161e24; --ink:#e4ebe8; --muted:#97a5ad; --rule:#2a363d;
  --seal:#4cc3a4; --seal-soft:#173a32; --sky:#6db7ea; --ok:#5fcf86; --ok-soft:#173826;
  --bad:#ff8a80; --bad-soft:#3d1d1b; --warn:#f0b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1519; --sheet:#161e24; --ink:#e4ebe8; --muted:#97a5ad; --rule:#2a363d;
  --seal:#4cc3a4; --seal-soft:#173a32; --sky:#6db7ea; --ok:#5fcf86; --ok-soft:#173826;
  --bad:#ff8a80; --bad-soft:#3d1d1b; --warn:#f0b54a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body)}
a{color:var(--sky)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:20px;background:var(--paper)}
.brand{font:700 1.35rem/1.1 var(--f-display);color:var(--ink);text-decoration:none}
.brand-logo{display:block;width:72px;height:72px;border-radius:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(21,34,56,.25)}
.brand small{display:block;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--seal);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--seal-soft)}
.nav a.on{background:var(--seal);color:var(--sheet)}
.badge{font:500 .72rem var(--f-mono);background:var(--bad);color:var(--sheet);border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:.82rem;color:var(--muted)}
main{padding-block:32px 96px;padding-inline:clamp(16px,4vw,56px);min-width:0}
.wrap{max-width:68ch}
.wide{max-width:1040px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.7rem)}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--seal)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--seal);background:var(--seal);color:var(--sheet);padding:10px 16px;border-radius:6px;font-weight:600;text-decoration:none}
.btn.ghost{background:transparent;color:var(--seal)}
.btn:disabled{opacity:.5;cursor:default}
/* bosh sahifa */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.hero p.lead{font-size:1.12rem;max-width:56ch}
.article{font-family:var(--f-display);font-style:italic;font-size:1.05rem;border-left:3px solid var(--seal);padding:4px 0 4px 16px}
.article b{display:block;font:500 .72rem var(--f-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.figures{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.figures div{font:600 1.6rem var(--f-mono);font-variant-numeric:tabular-nums}
.figures span{display:block;font:400 .8rem var(--f-body);color:var(--muted)}
.blocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin-top:32px}
.blocks section{min-width:0}
.toc{list-style:none;margin:12px 0 0;padding:0}
.toc li a{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:4px;padding:9px 0;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none}
.toc li a:hover{color:var(--seal)}
.toc .n{font:500 .85rem/1.9 var(--f-mono);color:var(--seal);font-variant-numeric:tabular-nums}
.toc .meta{display:block;font-size:.8rem;color:var(--muted)}
/* mavzu */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--rule);margin:20px 0 28px;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 12px;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--seal)}
.lecture h3{margin:32px 0 10px}
.lecture h3 .sec{font:500 .85rem var(--f-mono);color:var(--seal);margin-right:8px}
.lecture p{margin:0 0 12px}
.lecture ul{margin:0 0 12px;padding-left:1.2em}
.lecture li{margin-bottom:4px}
.defn{background:var(--seal-soft);border-radius:6px;padding:12px 16px;margin:0 0 14px}
.tbl{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--seal-soft);font-weight:600}
.plan{counter-reset:p;list-style:none;padding:0;margin:0}
.plan li{counter-increment:p;padding:8px 0 8px 2.4em;position:relative;border-bottom:1px solid var(--rule)}
.plan li::before{content:counter(p)".";position:absolute;left:0;font:500 .9rem/1.8 var(--f-mono);color:var(--seal)}
.summary{font-family:var(--f-display);font-size:1.08rem;border-top:2px solid var(--ink);padding-top:16px;margin-top:32px}
/* atamalar */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.term{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;min-width:0}
.term dt{font:700 1.02rem var(--f-display);margin-bottom:4px}
.term dd{margin:0;font-size:.93rem}
.term .src{font-size:.75rem;color:var(--muted);margin-top:8px}
input[type=search]{width:100%;max-width:480px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit}
/* taqdimot */
.deck{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:clamp(20px,4vw,40px);min-height:340px;display:flex;flex-direction:column;gap:18px}
.deck:fullscreen{justify-content:center;padding:6vw;font-size:1.3rem}
.deck .count{font:500 .8rem var(--f-mono);color:var(--muted)}
.deck h2{font-size:clamp(1.4rem,3vw,2rem)}
.deck .big{font-family:var(--f-display);font-size:1.25rem;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cards div{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;min-width:0}
.cards b{display:block;color:var(--seal)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px}
.steps li span{font:600 1rem var(--f-mono);color:var(--seal)}
/* test */
.qbox{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:clamp(18px,3vw,28px)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--seal);transition:width .2s}
.qtext{font:500 1.18rem/1.45 var(--f-display);margin:6px 0 18px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:2em minmax(0,1fr);text-align:left;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:11px 12px}
.opt:hover:not(:disabled){border-color:var(--seal)}
.opt .l{font:600 .95rem var(--f-mono);color:var(--seal)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;font-weight:600}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.score{font:600 3rem var(--f-mono);font-variant-numeric:tabular-nums}
.chooser{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chooser button{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:12px 14px;min-width:0}
.chooser button:hover{border-color:var(--seal)}
.chooser b{display:block}
.chooser small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:8px 14px}
.seg button.on{background:var(--seal);color:var(--sheet)}
.hist td.num,.hist th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--seal)}
.case{border-top:1px solid var(--rule);padding-top:16px}
.case ol{margin:8px 0 0;padding-left:1.3em}
.callout{border:1px dashed var(--seal);border-radius:8px;padding:14px 16px}
.lib-cat{margin-top:8px}
.lib-cat h2{font:700 1.25rem var(--f-display);margin:0 0 6px}
.lib{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.lib li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--rule)}
.lib .ico{font-size:1.3rem;flex:none}
.lib .t{flex:1;min-width:0}
.lib .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.lib .t small{font:500 .74rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lib .acts{display:flex;gap:6px;flex:none}
.lib .acts .btn{padding:6px 11px;font-size:.85rem}
@media (max-width:560px){.lib li{flex-wrap:wrap}.lib .acts{width:100%;padding-left:34px}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--rule);z-index:5;gap:0}
  .side .brand,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%;overflow-x:auto;scrollbar-width:none}
  .nav a{flex:none}
  .nav a{flex-direction:column;font-size:.72rem;padding:6px 4px;gap:2px}
  .hero,.blocks{grid-template-columns:minmax(0,1fr)}
  .mob-brand{display:block!important}
}
.mob-brand{display:none;font:700 1.1rem var(--f-display);margin-bottom:16px;color:var(--ink);text-decoration:none}
.mob-brand img{width:36px;height:36px;border-radius:9px;vertical-align:middle;margin-right:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="#home"><img class="brand-logo" src="apple-touch-icon.png" alt="">Huquq Akademiyasi<small>Davlat va huquq nazariyasi</small></a>
    <nav class="nav" id="nav">
      <a href="#home" data-r="home">Bosh sahifa</a>
      <a href="#mavzular" data-r="mavzu">Mavzular</a>
      <a href="#test" data-r="test">Test</a>
      <a href="#lugat" data-r="lugat">Lug'at</a>
      <a href="#kutubxona" data-r="kutubxona">Kutubxona</a>
      <a href="#xatolar" data-r="xatolar">Xatolar <span class="badge" id="due" hidden></span></a>
      <a href="#natijalar" data-r="natijalar">Natijalar</a>
    </nav>
    <div class="side-foot" id="botlink"></div>
  </aside>
  <main id="app"><p class="muted">Yuklanmoqda…</p></main>
</div>
<script>
// Telegram bot manzili (deploydan keyin o'zgartiring)
const BOT_USERNAME = "huquq_akademiyasi_bot";

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem("dhn_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("dhn_" + k, JSON.stringify(v)); } catch {} }
};
const DAY = 864e5, REVIEW_GAPS = [1, 3, 7];
let DATA, POOL = {};

// ---------- savollar banki: testlar + atamalardan yasalgan savollar ----------
function buildPool() {
  const allTerms = DATA.topics.flatMap(t => t.terms.map(x => ({...x, no: t.no})));
  for (const t of DATA.topics) {
    t.tests.forEach((q, i) => POOL[`t${t.no}-${i}`] = {id:`t${t.no}-${i}`, no:t.no, kind:"test", q:q.q, options:q.options, answer:q.answer});
    t.terms.forEach((x, i) => {
      const others = t.terms.filter(y => y !== x);
      const extra = others.length >= 3 ? [] : allTerms.filter(y => y.term !== x.term);
      const wrong = shuffle(others.concat(extra)).slice(0, 3).map(y => y.term);
      POOL[`a${t.no}-${i}`] = {id:`a${t.no}-${i}`, no:t.no, kind:"term", q:`Ta'rif qaysi tushunchaga tegishli?\n«${x.def}»`, options:[x.term, ...wrong], answer:0};
    });
  }
}
function prepare(q) {
  const order = shuffle(q.options.map((_, i) => i));
  return {...q, shown: order.map(i => q.options[i]), right: order.indexOf(q.answer)};
}

// ---------- xatolar daftari (1, 3, 7 kun) ----------
function markResult(id, ok) {
  const m = store.get("mistakes", {});
  if (!ok) m[id] = {stage: 0, due: Date.now() + REVIEW_GAPS[0] * DAY};
  else if (m[id]) {
    const st = m[id].stage + 1;
    if (st >= REVIEW_GAPS.length) delete m[id];
    else m[id] = {stage: st, due: Date.now() + REVIEW_GAPS[st] * DAY};
  }
  store.set("mistakes", m);
  updateDue();
}
function updateDue() {
  const m = store.get("mistakes", {}), n = Object.values(m).filter(x => x.due <= Date.now()).length;
  const b = $("#due"); b.textContent = n; b.hidden = !n;
}

// ---------- router ----------
const routes = {
  home: renderHome, mavzular: renderTopics, test: renderTestChooser, lugat: renderGlossary,
  xatolar: renderMistakes, natijalar: renderResults, kutubxona: renderLibrary
};
function go() {
  const h = (location.hash || "#home").slice(1);
  const m = h.match(/^mavzu-(\d+)(?:-(\w+))?$/);
  const app = $("#app");
  let key = h.split("-")[0];
  if (m) renderTopic(+m[1], m[2] || "maruza");
  else (routes[h] || renderHome)();
  if (m) key = "mavzu";
  if (h === "mavzular") key = "mavzu";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === key));
  window.scrollTo(0, 0);
  app.focus?.();
}
const mobBrand = `<a class="mob-brand" href="#home"><img src="apple-touch-icon.png" alt="">Huquq Akademiyasi</a>`;

function renderHome() {
  const t = DATA.topics, tests = t.reduce((s, x) => s + x.tests.length, 0), terms = t.reduce((s, x) => s + x.terms.length, 0);
  const half = 7; // 1–7: davlat nazariyasi, 8–15: huquq nazariyasi
  const item = x => `<li><a href="#mavzu-${x.no}"><span class="n">${String(x.no).padStart(2, "0")}</span><span>${esc(x.title)}<span class="meta">${x.lecture.length} bo'lim · ${x.tests.length} test · ${x.terms.length} atama</span></span></a></li>`;
  $("#app").innerHTML = `${mobBrand}<div class="wide">
  <div class="hero">
    <div class="stack">
      <span class="eyebrow">O'quv kursi · 1-qism</span>
      <h1>Davlat va huquq nazariyasi</h1>
      <p class="lead">Mavzulashtirilgan ma'ruzalar, taqdimotlar, tayanch atamalar, keyslar va testlar. O'qing, mashq qiling, xatolaringizni 1, 3 va 7 kundan keyin qayta ishlang.</p>
      <div class="row"><a class="btn" href="#mavzu-1">1-mavzudan boshlash</a><a class="btn ghost" href="#test">Test ishlash</a>${botBtn()}</div>
      <div class="figures"><div>${t.length}<span>mavzu</span></div><div>${tests + terms}<span>savol</span></div><div>${terms}<span>tayanch atama</span></div></div>
    </div>
    <div class="article"><b>Konstitutsiya, 1-modda</b>O'zbekiston — boshqaruvning respublika shakliga ega bo'lgan suveren, demokratik, huquqiy, ijtimoiy va dunyoviy davlat.</div>
  </div>
  <div class="blocks">
    <section><h2>Davlat nazariyasi</h2><ul class="toc">${t.slice(0, half).map(item).join("")}</ul></section>
    <section><h2>Huquq nazariyasi</h2><ul class="toc">${t.slice(half).map(item).join("")}</ul></section>
  </div></div>`;
}
function botBtn() { return BOT_USERNAME ? `<a class="btn ghost" href="https://t.me/${BOT_USERNAME}" target="_blank" rel="noopener">Telegram bot</a>` : ""; }

function renderTopics() {
  $("#app").innerHTML = `${mobBrand}<div class="wrap"><span class="eyebrow">Kurs mundarijasi</span><h1>Mavzular</h1>
  <ul class="toc">${DATA.topics.map(x => `<li><a href="#mavzu-${x.no}"><span class="n">${String(x.no).padStart(2, "0")}</span><span>${esc(x.title)}<span class="meta">${x.plan.length} reja bandi · ${x.tests.length} test</span></span></a></li>`).join("")}</ul></div>`;
}

const TABS = [["maruza","Ma'ruza"],["taqdimot","Taqdimot"],["atamalar","Atamalar"],["savollar","Savollar"],["keys","Keyslar"],["topshiriq","Topshiriqlar"],["test","Test"]];
function renderTopic(no, tab) {
  const t = DATA.topics.find(x => x.no === no);
  if (!t) return renderTopics();
  const prev = DATA.topics.find(x => x.no === no - 1), next = DATA.topics.find(x => x.no === no + 1);
  $("#app").innerHTML = `${mobBrand}<div class="wide"><span class="eyebrow">${no}-mavzu</span><h1>${esc(t.title)}</h1>
  <div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button role="tab" class="${k === tab ? "on" : ""}" onclick="location.hash='mavzu-${no}-${k}'">${l}</button>`).join("")}</div>
  <div id="pane"></div>
  <div class="row" style="justify-content:space-between;margin-top:40px;border-top:1px solid var(--rule);padding-top:16px">
    ${prev ? `<a href="#mavzu-${prev.no}">← ${esc(prev.title)}</a>` : "<span></span>"}
    ${next ? `<a href="#mavzu-${next.no}">${esc(next.title)} →</a>` : ""}</div></div>`;
  const pane = $("#pane");
  ({maruza: paneLecture, taqdimot: paneSlides, atamalar: paneTerms, savollar: paneQuestions, keys: paneCases, topshiriq: paneTasks, test: () => startQuiz(pane, {no, mode: "mix"})}[tab] || paneLecture)(pane, t);
}

function renderLines(lines) {
  let html = "", list = null, table = null;
  const flush = () => {
    if (list) { html += `<ul>${list.map(l => `<li>${inline(l)}</li>`).join("")}</ul>`; list = null; }
    if (table) {
      const [head, ...body] = table;
      html += `<div class="tbl"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      table = null;
    }
  };
  for (const l of lines) {
    if (l.startsWith("- ")) { if (table) flush(); (list ||= []).push(l.slice(2)); }
    else if (l.startsWith("|")) { if (list) flush(); (table ||= []).push(l.replace(/^\|\s*/, "").split("|").map(s => s.trim())); }
    else { flush(); html += l.startsWith("! ") ? `<p class="defn">${inline(l.slice(2))}</p>` : `<p>${inline(l)}</p>`; }
  }
  flush();
  return html;
}
function paneLecture(pane, t) {
  pane.innerHTML = `<div class="wrap lecture">
    <h2>Reja</h2><ol class="plan">${t.plan.map(p => `<li>${inline(p)}</li>`).join("")}</ol>
    ${t.lecture.map((s, i) => `<h3 id="s${i}">${inline(s.title)}</h3>${renderLines(s.lines)}`).join("")}
    <div class="summary"><span class="eyebrow">Xulosa</span>${t.summary.map(p => `<p>${inline(p)}</p>`).join("")}</div></div>`;
}
function slideHTML(s) {
  const L = s.lines;
  if (s.kind === "def") return `<div class="big">${L.map(inline).join("<br>")}</div>`;
  if (s.kind === "cards") return `<div class="cards">${L.map(l => { const [a, ...b] = l.split(":"); return b.length ? `<div><b>${inline(a)}</b>${inline(b.join(":").trim())}</div>` : `<div>${inline(l)}</div>`; }).join("")}</div>`;
  if (s.kind === "steps") return `<ol class="steps">${L.map((l, i) => { const [a, ...b] = l.split(":"); return `<li><span>${i + 1}</span><div><b>${inline(a)}</b>${b.length ? " — " + inline(b.join(":").trim()) : ""}</div></li>`; }).join("")}</ol>`;
  if (s.kind === "table") return renderLines(L.map(l => "| " + l));
  return `<ul>${L.map(l => `<li>${inline(l)}</li>`).join("")}</ul>`;
}
function paneSlides(pane, t) {
  let i = 0;
  const draw = () => {
    const s = t.slides[i];
    pane.innerHTML = `<div class="deck" id="deck"><span class="count">${i + 1} / ${t.slides.length}</span><h2>${inline(s.title)}</h2>${slideHTML(s)}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="pv" ${i ? "" : "disabled"}>← Oldingi</button><button class="btn" id="nx" ${i < t.slides.length - 1 ? "" : "disabled"}>Keyingi →</button><button class="btn ghost" id="fs">To'liq ekran</button><span class="muted">Klaviatura: ← →</span></div>`;
    $("#pv").onclick = () => { i--; draw(); };
    $("#nx").onclick = () => { i++; draw(); };
    $("#fs").onclick = () => { $("#deck").requestFullscreen?.().catch(() => {}); };
  };
  document.onkeydown = e => {
    if (!$("#deck")) return;
    if (e.key === "ArrowRight" && i < t.slides.length - 1) { i++; draw(); }
    if (e.key === "ArrowLeft" && i > 0) { i--; draw(); }
  };
  draw();
}

// ---------- test ----------
function pickQuestions({no, mode, ids, n = 10}) {
  if (ids) return shuffle(ids).map(id => POOL[id]).filter(Boolean);
  let qs = Object.values(POOL).filter(q => (!no || q.no === no) && (mode === "mix" || q.kind === mode));
  return shuffle(qs).slice(0, n);
}
function startQuiz(pane, opts) {
  const qs = pickQuestions(opts).map(prepare);
  if (!qs.length) { pane.innerHTML = `<p class="muted">Savollar topilmadi.</p>`; return; }
  let i = 0, right = 0;
  const title = opts.ids ? "Xatolar ustida ishlash" : opts.mode === "term" ? "Atamalar o'yini" : "Test";
  const draw = () => {
    const q = qs[i];
    pane.innerHTML = `<div class="wrap"><div class="qbox"><div class="progress"><i style="width:${i / qs.length * 100}%"></i></div>
      <span class="eyebrow">${title} · ${i + 1}/${qs.length} · ${q.no}-mavzu</span>
      <div class="qtext">${inline(q.q)}</div>
      <div class="opts">${q.shown.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${"ABCDEF"[k]}</span><span>${inline(o)}</span></button>`).join("")}</div>
      <div id="fb"></div></div></div>`;
    pane.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.right;
      if (ok) right++;
      markResult(q.id, ok);
      pane.querySelectorAll(".opt").forEach(x => { x.disabled = true; });
      pane.querySelectorAll(".opt")[q.right].classList.add("ok");
      if (!ok) b.classList.add("bad");
      $("#fb", pane).innerHTML = `<p class="feedback ${ok ? "ok" : "bad"}">${ok ? "To'g'ri!" : "Noto'g'ri. To'g'ri javob: " + "ABCDEF"[q.right]}</p>
        <button class="btn" id="nq">${i < qs.length - 1 ? "Keyingi savol" : "Natijani ko'rish"}</button>`;
      $("#nq").onclick = () => { i++; i < qs.length ? draw() : finish(); };
      $("#nq").focus();
    });
  };
  const finish = () => {
    const pct = Math.round(right / qs.length * 100);
    const h = store.get("history", []);
    h.push({no: opts.no || 0, mode: opts.ids ? "review" : opts.mode, right, total: qs.length, ts: Date.now()});
    store.set("history", h.slice(-300));
    pane.innerHTML = `<div class="wrap"><div class="qbox stack"><span class="eyebrow">${title} yakunlandi</span>
      <div class="score">${right}/${qs.length}</div><p>${pct >= 86 ? "A'lo natija." : pct >= 71 ? "Yaxshi natija." : pct >= 56 ? "Qoniqarli. Xatolar daftarini takrorlang." : "Mavzuni qayta o'qib chiqing va xatolar ustida ishlang."} (${pct}%)</p>
      <div class="row"><button class="btn" id="again">Yana ishlash</button><a class="btn ghost" href="#xatolar">Xatolar daftari</a>${opts.no ? `<a class="btn ghost" href="#mavzu-${opts.no}">Ma'ruzaga qaytish</a>` : ""}</div></div></div>`;
    $("#again").onclick = () => startQuiz(pane, opts);
  };
  draw();
}

function renderGlossary() {

let LIB = null;
function renderLibrary() {
  const app = $("#app");
  if (!LIB) {
    app.innerHTML = `${mobBrand}<p class="muted">Kutubxona yuklanmoqda…</p>`;
    fetch("kutubxona.json").then(r => r.json()).then(d => { LIB = d; if ((location.hash || "").slice(1) === "kutubxona") renderLibrary(); })
      .catch(() => { app.innerHTML = `${mobBrand}<p>Kutubxona yuklanmadi. Sahifani yangilang.</p>`; });
    return;
  }
  const ICON = {pdf: "📕", doc: "📘", docx: "📘", djvu: "📙", epub: "📗"};
  const size = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  const total = LIB.categories.reduce((s, c) => s + c.books.length + c.links.length, 0);
  app.innerHTML = `${mobBrand}<div class="wide stack"><span class="eyebrow">${total} ta manba</span><h1>Elektron kutubxona</h1>
    <p class="wrap">Darsliklar, o'quv qo'llanmalar, xorijiy adabiyotlar va qonun hujjatlari. PDF kitoblar brauzerda ochiladi, Word fayllar yuklab olinadi.${BOT_USERNAME ? " Istalgan kitobni Telegram botda ham olishingiz mumkin." : ""}</p>
    <label for="q" class="muted">Muallif yoki nom bo'yicha qidirish</label><input type="search" id="q" placeholder="Masalan: Saydullayev"><div id="list" class="stack"></div></div>`;
  const draw = f => {
    const s = f.trim().toLowerCase(), hit = t => !s || t.toLowerCase().includes(s);
    const html = LIB.categories.map(c => {
      const books = c.books.filter(b => hit(b.title)), links = c.links.filter(l => hit(l.title));
      if (!books.length && !links.length) return "";
      const bot = b => BOT_USERNAME ? `<a class="btn ghost" href="https://t.me/${BOT_USERNAME}?start=k${b.id}" target="_blank" rel="noopener">Botda</a>` : "";
      const open = b => b.file ? `<a class="btn" href="${b.file}" ${b.ext === "pdf" ? 'target="_blank" rel="noopener"' : `download="${esc(b.title)}.${b.ext}"`}>${b.ext === "pdf" ? "O'qish" : "Yuklab olish"}</a>` : "";
      return `<section class="lib-cat"><h2>${esc(c.title)}</h2><ul class="lib">
        ${books.map(b => `<li><span class="ico" aria-hidden="true">${ICON[b.ext] || "📄"}</span><span class="t"><b>${esc(b.title)}</b><small>${b.ext} · ${size(b.size)}${b.file ? "" : " · faqat botda"}</small></span><span class="acts">${open(b)}${bot(b)}</span></li>`).join("")}
        ${links.map(l => `<li><span class="ico" aria-hidden="true">🔗</span><span class="t"><b>${esc(l.title)}</b><small>lex.uz · amaldagi tahrir</small></span><span class="acts"><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">Ochish</a></span></li>`).join("")}
      </ul></section>`;
    }).join("");
    $("#list").innerHTML = html || `<p class="muted">Hech narsa topilmadi.</p>`;
  };
  $("#q").oninput = e => draw(e.target.value);
  draw("");
}

    <div class="callout row"><b>${due.length}</b> ta savol takrorlashni kutmoqda · jami ${ids.length} ta</div>
    <div class="row"><button class="btn" id="rv" ${due.length ? "" : "disabled"}>Muddati kelganlarni takrorlash</button><button class="btn ghost" id="ra" ${ids.length ? "" : "disabled"}>Hammasini hozir takrorlash</button></div>

function renderResults() {
  const h = store.get("history", []);
  const by = {};
  for (const r of h) if (r.no) { const b = by[r.no] ||= {right: 0, total: 0, best: 0, n: 0}; b.right += r.right; b.total += r.total; b.n++; b.best = Math.max(b.best, Math.round(r.right / r.total * 100)); }
  const tot = h.reduce((s, r) => s + r.total, 0), ok = h.reduce((s, r) => s + r.right, 0);
  $("#app").innerHTML = `${mobBrand}<div class="wide stack"><span class="eyebrow">Shu qurilmadagi natijalar</span><h1>Natijalarim</h1>
    <div class="figures"><div>${h.length}<span>urinish</span></div><div>${tot}<span>javob</span></div><div>${tot ? Math.round(ok / tot * 100) : 0}%<span>aniqlik</span></div></div>
    <div class="tbl"><table class="hist"><thead><tr><th>Mavzu</th><th class="num">Urinish</th><th class="num">Eng yaxshi</th><th>O'rtacha aniqlik</th></tr></thead><tbody>
    ${DATA.topics.map(t => { const b = by[t.no]; const avg = b ? Math.round(b.right / b.total * 100) : 0; return `<tr><td><a href="#mavzu-${t.no}-test">${t.no}. ${esc(t.title)}</a></td><td class="num">${b ? b.n : "—"}</td><td class="num">${b ? b.best + "%" : "—"}</td><td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${avg}%"></i></div><span class="muted" style="font-family:var(--f-mono);min-width:3.5ch">${b ? avg + "%" : ""}</span></div></td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="muted">Natijalar faqat shu brauzerda saqlanadi. Guruh reytingi va jonli seminar Telegram botda.</p></div>`;
}
